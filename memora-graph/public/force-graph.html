<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Memora · Force Graph (prototype)</title>
<!--
  PROTOTYPE: vasturiano force-graph (2D) + 3d-force-graph (three.js/WebGL), with a
  TIMELINE DRAWER (right) and a DETAIL pane. Graph is the main view; the Timeline
  button slides a month-grouped memory list in from the right; clicking an entry
  focuses that node in the graph and opens its markdown detail just left of the
  drawer. Consumes /api/graph + /api/memories (same-origin). 3D needs WebGL; the
  2D graph, timeline, and detail are pure canvas/DOM (work in LibreWolf).
-->
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  #graph { position: fixed; inset: 0; transition: right .18s; }
  /* live-update badge (polls for changes; click to pull them in) */
  #refresh { display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 40; background: #a855f7; color: #fff; border: 1px solid #c084fc; border-radius: 8px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; box-shadow: 0 4px 16px #0008; }
  #refresh:hover { background: #c084fc; }
  /* shrink the graph canvas to the area NOT covered by the right drawers,
     so force-graph recenters the layout into the visible region */
  body.panel-open:not(.timeline-open) #graph { right: 380px; }
  body.timeline-open:not(.panel-open) #graph { right: 360px; }
  body.timeline-open.panel-open #graph { right: 740px; }
  @media (max-width: 900px) { body.timeline-open.panel-open #graph { right: 0; } }
  #bar { position: fixed; top: 12px; left: 12px; z-index: 30; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; max-width: calc(100vw - 24px); }
  .pill { background: #161b22cc; border: 1px solid #30363d; border-radius: 8px;
    padding: 6px 10px; backdrop-filter: blur(6px); display: flex; gap: 8px; align-items: center; }
  button, select, input { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.active { background: #a855f7; border-color: #a855f7; color: #fff; }
  input { cursor: text; min-width: 160px; }
  a.nav { color: #79c0ff; text-decoration: none; }
  #stats { color: #7d8590; } #err { color: #f85149; }

  /* ---- timeline drawer (right) ---- */
  #timeline { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; z-index: 31;
    background: #0d1117f7; border-left: 1px solid #30363d; backdrop-filter: blur(8px);
    transform: translateX(100%); transition: transform .18s; display: flex; flex-direction: column; }
  body.timeline-open #timeline { transform: none; }
  #tlhead { display: flex; gap: 8px; align-items: center; padding: 12px; border-bottom: 1px solid #21262d; }
  #tlhead h2 { margin: 0; font-size: 14px; color: #a855f7; flex: 1; }
  #tlfav { background: none; border: 1px solid #30363d; color: #6e7681; padding: 2px 9px; border-radius: 6px; cursor: pointer; }
  #tlfav.active { color: #e3b341; border-color: #e3b341; }
  .trow .star { color: #4d535b; cursor: pointer; flex: none; font-size: 12px; }
  .trow .star.on, .trow .star:hover { color: #e3b341; }
  /* ---- timeline controls: year + month + order dropdowns ---- */
  #tlctrls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #21262d; }
  #tlctrls select { flex: 1 1 calc(50% - 3px); min-width: 0; }
  #tllist { flex: 1; overflow: auto; padding: 0 12px 40px; }
  .mh { position: sticky; top: 0; background: #0d1117; color: #a855f7; font-size: 12px;
    padding: 8px 0 4px; border-bottom: 1px solid #21262d; margin-top: 12px; z-index: 2; }
  .trow { padding: 7px 0; border-bottom: 1px solid #161b22; cursor: pointer; }
  .trow:hover { background: #161b2266; }
  .trow.active { background: #1f2937; box-shadow: inset 3px 0 0 #a855f7; padding-left: 6px; }
  .trow .l1 { display: flex; gap: 6px; align-items: baseline; }
  .trow .type { font-size: 9px; border: 1px solid #30363d; border-radius: 10px; padding: 0 5px; color: #9da7b3; flex:none }
  .trow .ttl { color: #e6edf3; font-size: 11px; min-width: 0; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-clamp: 2; }
  .trow .day { color: #7d8590; font-size: 10px; }
  .trow .day .dup { color: #f85149; }
  .trow .day .sup { color: #d29922; }
  .trow.superseded-row { opacity: 0.72; }
  .trow.superseded-row .ttl { color: #b8a078; }
  #lineage-warn { display: none; position: fixed; top: 52px; left: 12px; z-index: 40;
    background: #3d2e00; color: #ffe08a; border: 1px solid #d29922; border-radius: 8px;
    padding: 6px 12px; font-size: 12px; max-width: 480px; }
  .trow.unknown-row { opacity: 0.65; }
  .trow.unknown-row .ttl { color: #8b949e; font-style: italic; }
  .trow .day .unk { color: #8b949e; }

  /* ---- detail pane (sits left of the drawer when it's open) ---- */
  /* hidden fully off-screen via `right` (not transform — a width-relative transform
     didn't clear the viewport once the panel was shifted left of the timeline, so it
     covered the drawer and stole clicks). pointer-events off while hidden. */
  #panel { position: fixed; top: 0; right: -440px; bottom: 0; width: 380px; z-index: 32;
    background: #0d1117f7; border-left: 1px solid #30363d; backdrop-filter: blur(8px);
    padding: 16px; overflow: auto; transition: right .2s; pointer-events: none; }
  body.panel-open #panel { right: 0; pointer-events: auto; }
  body.panel-open.timeline-open #panel { right: 360px; }
  #panel h2 { margin: 0 0 2px; font-size: 15px; color: #a855f7; }
  #panel .meta { color: #7d8590; font-size: 11px; margin-bottom: 10px; }
  #panel .close, #tlhead .close { padding: 2px 8px; }
  #panel .close { position: absolute; top: 12px; right: 12px; }
  #panel .dupe { color: #f85149; font-weight: bold; }
  #panel .superseded { color: #d29922; font-weight: bold; }
  .tags span { display: inline-block; background: #21262d; border: 1px solid #30363d; border-radius: 10px;
    padding: 1px 8px; margin: 0 4px 4px 0; font-size: 11px; color: #9da7b3; }
  /* rendered markdown */
  .md { font: 11.5px/1.5 -apple-system, system-ui, sans-serif; color: #c9d1d9; }
  .md h1,.md h2,.md h3 { color: #e6edf3; margin: 10px 0 5px; } .md h1{font-size:14px}.md h2{font-size:13px}.md h3{font-size:12px}
  .md p { margin: 7px 0; } .md ul,.md ol { margin: 7px 0; padding-left: 20px; } .md a { color: #79c0ff; }
  .md code { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px;
    font: 12px ui-monospace,monospace; color: #ffa657; }
  .md pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; overflow:auto }
  .md pre code { background: none; border: none; padding: 0; color: #c9d1d9; }
  .md blockquote { border-left: 3px solid #30363d; margin: 7px 0; padding: 2px 12px; color: #9da7b3; }
  .md img { max-width: 100%; border-radius: 6px; }
  #panel .imgs { margin-top: 12px; border-top: 1px solid #21262d; padding-top: 10px; }
  #panel .imgs figure { margin: 0 0 10px; }
  #panel .imgs img { max-width: 100%; border-radius: 6px; border: 1px solid #30363d; display: block; }
  #panel .imgs figcaption { font-size: 11px; color: #7d8590; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div id="bar">
  <div class="pill"><button id="b2d">2D</button><button id="b3d" class="active">3D</button></div>
  <div class="pill"><label>DB <select id="db" disabled><option value="">loading...</option></select></label></div>
  <div class="pill"><input id="search" placeholder="search label / #id …" /></div>
  <div class="pill"><label><input type="checkbox" id="dupes" style="min-width:auto" /> dupes only</label></div>
  <div class="pill" title="Default: show lineage — dim superseded nodes and draw supersedes edges. Uncheck to hide superseded (current-state only).">
    <label><input type="checkbox" id="lineage" checked style="min-width:auto" /> lineage</label>
  </div>
  <div class="pill"><button id="bcl" class="active">◉ Clusters</button></div>
  <div class="pill"><button id="bdoc" class="active">◫ Docs</button></div>
  <div class="pill"><button id="btl">☰ Timeline</button></div>
  <div class="pill" id="stats">loading…</div>
</div>

<div id="refresh" onclick="doRefresh()"></div>
<div id="lineage-warn">Lineage unavailable — cannot confirm which memories are current</div>
<div id="graph"></div>

<!-- timeline drawer -->
<div id="timeline">
  <div id="tlhead">
    <h2>Timeline</h2>
    <button id="tlfav" title="favorites only">★</button>
    <button class="close" onclick="toggleTimeline(false)">✕</button>
  </div>
  <div id="tlctrls">
    <select id="tlyear" title="year"></select>
    <select id="tlmonth" title="month"></select>
    <select id="tltype" title="type"></select>
    <select id="tlstatus" title="issue status" style="display:none"><option value="">All status</option><option value="open">open</option><option value="closed">closed</option></select>
    <select id="tlorder"><option value="desc">newest</option><option value="asc">oldest</option></select>
  </div>
  <div id="tllist">loading…</div>
</div>

<!-- detail pane -->
<div id="panel"></div>

<!-- Pure selection/detail ownership — tests import the same file (K2). -->
<script type="module">
import {
  planSelectionReconcile,
  createDetailOwner,
  detailResponseMayWrite,
} from "./_selection.mjs";

// Detail ownership session (K1) — shared by openDetail / close / deselect / clear.
const detailOwner = createDetailOwner();
// Expose pure helpers for console debug only (not for tests — tests import the module).
window.MemoraSelection = { planSelectionReconcile, detailResponseMayWrite, detailOwner };

const el = (id) => document.getElementById(id);
const graphEl = el("graph"), statsEl = el("stats");
const DATABASE_STORAGE_KEY = "memora-graph.database";
let raw = null, mode = "3d", fg = null;
let mems = null, memsLoaded = false, byId = {}, activeRow = null, rowById = {}, pendingHighlight = null;
// M4: monotonic load generation + AbortController so DB switches cannot paint A onto B.
let loadGen = 0, loadAbort = null, loadDb = "";

const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let mdReady = false;
function renderMd(s) {
  try {
    if (window.marked && window.DOMPurify) {
      if (!mdReady) {
        // Render raw HTML in the markdown as LITERAL text. Memory content is full of
        // CLI placeholders like <name>/<id>/<repo-or-dir>; without this marked emits
        // them as HTML tags and DOMPurify strips them (the text vanishes).
        const r = new marked.Renderer();
        r.html = (t) => esc(typeof t === "string" ? t : (t && (t.text || t.raw)) || "");
        marked.use({ renderer: r, breaks: true });
        mdReady = true;
      }
      return DOMPurify.sanitize(marked.parse(String(s || "")));
    }
  } catch (e) {}
  return `<pre>${esc(s)}</pre>`;
}
const typeOf = (m) => (m.metadata && m.metadata.type) || (m.metadata && m.metadata.severity ? "issue"
  : m.metadata && (m.metadata.priority || m.metadata.status) ? "todo" : "memory");
const labelOf = (m) => (m.content || "").split("\n")[0].replace(/^#+\s*/, "").replace(/[`*_]/g, "").trim().slice(0, 120) || ("#" + m.id);
const isFav = (m) => { const f = (m.metadata || {}).favorite; return f === true || f === 1 || f === "true"; };
// Render a memory's attached images (metadata.images). The API already rewrites r2://
// to the /api/r2/ proxy; we just append ?db= for the right bucket.
function renderImages(m) {
  const imgs = (m.metadata && m.metadata.images) || [];
  if (!Array.isArray(imgs) || !imgs.length) return "";
  const db = el("db").value;
  const fix = (src) => {
    if (!src) return "";
    if (src.startsWith("r2://")) src = "/api/r2/" + src.slice(5);
    if (src.startsWith("/api/r2/") && !src.includes("?")) src += "?db=" + encodeURIComponent(db);
    return src;
  };
  return `<div class="imgs">` + imgs.map(im =>
    `<figure><img src="${esc(fix(im.src))}" loading="lazy" alt="${esc(im.caption || "")}">` +
    (im.caption ? `<figcaption>${esc(im.caption)}</figcaption>` : "") + `</figure>`).join("") + `</div>`;
}
async function toggleFav(m, row) {
  const next = !isFav(m);
  try {
    const r = await fetch(`/api/memories/${m.id}?db=${encodeURIComponent(el("db").value)}`, {
      method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ favorite: next }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    m.metadata = m.metadata || {}; if (next) m.metadata.favorite = true; else delete m.metadata.favorite;
    const s = row && row.querySelector(".star"); if (s) s.classList.toggle("on", next);
    if (el("tlfav").classList.contains("active") && !next) drawTimeline();   // dropped out of favorites view
  } catch (e) { /* leave state unchanged on failure */ }
}
function webglOK() { try { const c = document.createElement("canvas");
  return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl"))); } catch (e) { return false; } }

/* ---------------- graph ---------------- */
// Deterministic per-id jitter so the layout is stable across reloads.
function jit(id, salt) { const h = ((id * 2654435761) ^ (salt * 40503)) >>> 0; return (h % 200) - 100; }
// Place each Louvain cluster at a ring position and start its members near that
// center (3D adds a z offset). The force sim then refines — but communities begin
// grouped instead of randomly tangled, so the result is tighter and more stable.
function seedClusterPositions(nodes) {
  const ckeys = Object.keys(clusterToNodes);
  const nC = ckeys.length || 1;
  const radius = Math.min(320, 120 + nC * 14);   // capped — was uncapped (240+nC*38), sprawled badly with many clusters
  const centers = {};
  ckeys.forEach((cid, i) => { const a = (2 * Math.PI * i) / nC;
    centers[cid] = { x: Math.cos(a) * radius, y: Math.sin(a) * radius, z: Math.sin(a * 1.7) * radius * 0.55 }; });
  for (const n of nodes) {
    const c = clusterOf[n.id] != null ? centers[clusterOf[n.id]] : null;
    if (c) { n.x = c.x + jit(n.id, 1) * 0.6; n.y = c.y + jit(n.id, 2) * 0.6; n.z = c.z + jit(n.id, 3) * 0.6; }
    else { n.x = jit(n.id, 4) * 2.4; n.y = jit(n.id, 5) * 2.4; n.z = jit(n.id, 6) * 2.4; }
  }
}
// Spread the hairball: stronger but range-limited repulsion + longer links.
function tuneForces() {
  if (!fg || !fg.d3Force) return;
  try {
    const charge = fg.d3Force("charge");
    if (charge && charge.strength) { charge.strength(-55); if (charge.distanceMax) charge.distanceMax(220); }
    const link = fg.d3Force("link");
    if (link && link.distance) link.distance(32);
  } catch (e) {}
  // fresh graphData() already starts a hot simulation, so the new force params take
  // effect on the next tick — no explicit reheat needed (reheating here races the
  // not-yet-initialized simulation and throws).
}

// Default ON: show lineage (superseded dimmed + supersedes edges).
// Uncheck = mode (a): hide superseded nodes entirely (current-state only).
// When lineageAvailable===false the toggle is disabled — current-only is impossible.
function lineageAvailable() {
  return raw && raw.lineageAvailable !== false;
}
function showLineage() {
  if (!lineageAvailable()) return true; // show all nodes as unknown, never filter as "current"
  return el("lineage") ? el("lineage").checked : true;
}

/** Per-node authority-unknown ids from API (self_cycle etc.) — not only global fail. */
function authorityUnknownSetFromRaw() {
  const s = new Set();
  if (!raw || !raw.nodes) return s;
  if (raw.lineageAvailable === false) {
    for (const n of raw.nodes) s.add(n.id);
    return s;
  }
  for (const n of raw.nodes) {
    if (n.authority_unknown) s.add(n.id);
  }
  return s;
}

function freshGraphData() {
  if (!raw || !raw.nodes) return { nodes: [], links: [] };
  const dupes = new Set(raw.duplicateIds || []);
  const globalUnknown = !lineageAvailable();
  const superseded = new Set(
    Array.isArray(raw.supersededIds) ? raw.supersededIds : [],
  );
  for (const n of (raw.nodes || [])) {
    if (n.superseded) superseded.add(n.id);
  }
  const authUnknown = authorityUnknownSetFromRaw();
  let nodes = raw.nodes.map(n => ({
    id: n.id, label: n.frag ? "" : (n.label || ("#" + n.id)), title: n.title || "",
    val: n.frag ? 2.2 : Math.max(1, (n.size || 12) / 6),
    color: typeof n.color === "string" ? n.color : (n.color?.background || "#a855f7"),
    dupe: dupes.has(n.id), frag: !!n.frag,
    superseded: !globalUnknown && (superseded.has(n.id) || !!n.superseded),
    // H2: per-node authority_unknown even when lineageAvailable is true
    authority_unknown: globalUnknown || authUnknown.has(n.id) || !!n.authority_unknown,
    superseded_by: n.superseded_by || [],
    supersedes: n.supersedes || [],
  }));
  // Mode (a): hide non-current when lineage toggle is off — only if lineage is known.
  // H2: exclude BOTH superseded and authority_unknown from "current-state only".
  if (lineageAvailable() && !showLineage()) {
    nodes = nodes.filter(n => !n.superseded && !n.authority_unknown);
  }
  const present = new Set(nodes.map(n => n.id));
  const links = (raw.edges || []).filter(e => present.has(e.from) && present.has(e.to))
    .map(e => ({
      source: e.from,
      target: e.to,
      edge_type: e.edge_type || "related_to",
      // H5: wire `directed` = semantic order meaningful; do NOT shadow with lineage.
      // Local `lineage` is the M1 styling marker (edge_type === "supersedes" only).
      directed: !!e.directed,
      lineage: e.edge_type === "supersedes",
      score: e.score,
    }));
  seedClusterPositions(nodes);
  return { nodes, links };
}
function applyFilters(gd) {
  const q = el("search").value.trim().toLowerCase();
  const dupesOnly = el("dupes").checked;
  let nodes = gd.nodes;
  if (dupesOnly) nodes = nodes.filter(n => n.dupe);
  if (q) nodes = nodes.filter(n => n.label.toLowerCase().includes(q) || ("#" + n.id).includes(q));
  const keep = new Set(nodes.map(n => n.id));
  const idOf = (x) => (x && typeof x === "object") ? x.id : x;
  return { nodes, links: gd.links.filter(l => keep.has(idOf(l.source)) && keep.has(idOf(l.target))) };
}
/* ---- clusters (Louvain communities from /api/graph) ---- */
let showClusters = true, clusterToNodes = {}, clusterColors = {}, clusterOf = {};
let showDocs = true;   // include document fragments in the graph (?docs=1) by default; timeline always excludes them
function buildClusters() {
  clusterToNodes = raw.clusterToNodes || {};
  clusterColors = raw.clusterColors || {};
  clusterOf = {};
  for (const cid in clusterToNodes) for (const id of clusterToNodes[cid]) clusterOf[id] = cid;
}
// convex-hull blob helpers (ported from the original index.html cluster hulls)
function cross(O, A, B) { return (A.x - O.x) * (B.y - O.y) - (A.y - O.y) * (B.x - O.x); }
function convexHull(points) {
  if (points.length <= 2) return points.slice();
  points.sort((a, b) => a.x - b.x || a.y - b.y);
  const lower = [];
  for (const p of points) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  const upper = [];
  for (let i = points.length - 1; i >= 0; i--) { const p = points[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  upper.pop(); lower.pop(); return lower.concat(upper);
}
function expandHull(hull, pad) {
  if (hull.length < 3) return hull;
  let cx = 0, cy = 0; for (const h of hull) { cx += h.x; cy += h.y; } cx /= hull.length; cy /= hull.length;
  return hull.map(h => { const dx = h.x - cx, dy = h.y - cy, d = Math.hypot(dx, dy) || 1; return { x: h.x + dx / d * pad, y: h.y + dy / d * pad }; });
}
function drawSmoothClosed(ctx, hull) {
  const n = hull.length; if (n < 3) return; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = hull[(i - 1 + n) % n], p1 = hull[i], p2 = hull[(i + 1) % n], p3 = hull[(i + 2) % n], t = 6;
    const cp1x = p1.x + (p2.x - p0.x) / t, cp1y = p1.y + (p2.y - p0.y) / t;
    const cp2x = p2.x - (p3.x - p1.x) / t, cp2y = p2.y - (p3.y - p1.y) / t;
    if (i === 0) ctx.moveTo(p1.x, p1.y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
  }
  ctx.closePath();
}
// Hull shapes are in GRAPH coords — they only change when the layout moves, NOT when
// you zoom/pan. So compute once and cache; recompute only when the sim ticks. This
// keeps zoom/pan cheap (just re-stroke cached paths) instead of re-running the hull
// algorithm every frame (which made zooming stutter).
let hullCache = null, hullsDirty = true;
function computeHulls() {
  const out = []; if (!fg) return out;
  const nodes = fg.graphData().nodes; if (!nodes.length) return out;
  const pos = {}; for (const n of nodes) pos[n.id] = n;
  for (const cid in clusterToNodes) {
    const members = clusterToNodes[cid]; if (!members || members.length < 3) continue;
    const pts = [];
    for (const id of members) { const n = pos[id]; if (n && isFinite(n.x) && isFinite(n.y)) pts.push({ x: n.x, y: n.y }); }
    if (pts.length < 3) continue;
    let hull = convexHull(pts); if (hull.length < 3) continue;

const CLOSED_STATUSES = new Set(["closed", "resolved", "wontfix", "completed", "done", "cancelled", "canceled"]);
const statusOf = (m) => CLOSED_STATUSES.has((m.metadata || {}).status) ? "closed" : "open";
const hasStatusFilter = (t) => t === "issue" || t === "todo";

function drawTimeline() {
  if (!mems) return;
  const order = el("tlorder").value;
  let all = mems.filter(m => m.created).slice().sort((a, b) => a.created < b.created ? 1 : -1);
  if (order === "asc") all.reverse();

  populateYears(all); populateMonths(all); populateTypes(all);
  const yr = el("tlyear").value, mo = el("tlmonth").value, ty = el("tltype").value;
  // The status sub-select only applies to (and only shows for) status-bearing
  // types (issue, todo).
  const stSel = el("tlstatus");
  const showStatus = hasStatusFilter(ty);
  stSel.style.display = showStatus ? "" : "none";
  if (!showStatus && stSel.value) stSel.value = "";
  const st = showStatus ? stSel.value : "";
  const favOnly = el("tlfav").classList.contains("active");
  // M2/H2: re-sync flags from graph raw (covers load race + toggle), filter when lineage off.
  const supers = supersededSetFromRaw();
  const authUnknown = authorityUnknownSetFromRaw();
  const globalUnknown = !lineageAvailable();
  for (const m of all) {
    m._unknown = globalUnknown || authUnknown.has(m.id);
    m._superseded = !globalUnknown && supers.has(m.id);
  }
  let pool = all;
  // F1: when lineage unavailable, never pretend current-only filtering works.
  // H2: current-only excludes BOTH superseded and per-node authority_unknown.
  if (lineageAvailable() && !showLineage()) {
    pool = pool.filter(m => !m._superseded && !m._unknown);
  }
  const rows = pool.filter(m =>
    (!yr || m.created.slice(0, 4) === yr) && (!mo || m.created.slice(5, 7) === mo) &&
    (!ty || typeOf(m) === ty) && (!st || statusOf(m) === st) && (!favOnly || isFav(m)));
  el("tlhead").querySelector("h2").textContent = `Timeline (${rows.length})`;

  const list = el("tllist"); list.innerHTML = ""; rowById = {}; activeRow = null; let cur = "";
  for (const m of rows) {
    const mon = m.created.slice(0, 7);
    if (mon !== cur) { cur = mon; const h = document.createElement("div"); h.className = "mh"; h.id = "tmh-" + mon;
      h.textContent = monthLabel(mon); list.appendChild(h); }
    const row = document.createElement("div");
    row.className = "trow"
      + (m._dupe ? " dupe" : "")
      + (m._superseded ? " superseded-row" : "")
      + (m._unknown ? " unknown-row" : "");
    const typeLabel = hasStatusFilter(typeOf(m)) ? `${typeOf(m)} · ${statusOf(m)}` : typeOf(m);
    const badges =
      (m._dupe ? ' · <span class="dup">dup</span>' : "") +
      (m._superseded ? ' · <span class="sup">superseded</span>' : "") +
      (m._unknown ? ' · <span class="unk">authority unknown</span>' : "");
    row.innerHTML = `<div class="l1"><span class="star${isFav(m) ? " on" : ""}">★</span><span class="type">${esc(typeLabel)}</span><span class="ttl">${esc(labelOf(m))}</span></div>` +
      `<div class="day">${m.created.slice(0, 10)} · #${m.id}${badges}</div>`;
    rowById[m.id] = row;
    row.querySelector(".star").onclick = (e) => { e.stopPropagation(); toggleFav(m, row); };
    // Pass superseded explicitly — do not rely on openDetail fallback after paint.
    row.onclick = () => selectMemory(m.id, m._dupe, m, !!m._superseded);
    list.appendChild(row);
  }
  if (pendingHighlight != null) highlightTimeline(pendingHighlight);
}

/* ---------------- live-update polling (non-disruptive badge) ---------------- */
let pollTimer = null, baseSig = null, baselineGen = 0, baselineDb = "";
async function fetchSignal(db, gen) {
  const r = await fetch(`/api/memories?db=${encodeURIComponent(db)}&limit=1&sort=created`, {
    signal: loadAbort ? loadAbort.signal : undefined,
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  if (gen != null && gen !== loadGen) return null;
  if (db !== el("db").value) return null;
  const d = await r.json();
  return { total: d.total, maxId: (d.memories[0] && d.memories[0].id) || 0 };
}
function hideRefresh() { el("refresh").style.display = "none"; }
async function captureBaseline(gen, db) {
  try {
    const s = await fetchSignal(db != null ? db : el("db").value, gen != null ? gen : loadGen);
    if (!s) return;
    if (gen != null && gen !== loadGen) return;
    if (db != null && db !== el("db").value) return;
    baseSig = s;
    baselineGen = loadGen;
    baselineDb = el("db").value;
  } catch (e) {}
  hideRefresh();
}
function startPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = setInterval(checkUpdates, 20000); }
async function checkUpdates() {
  if (document.hidden || !baseSig) return;
  if (baselineGen !== loadGen || baselineDb !== el("db").value) return;
  try {
    const s = await fetchSignal(el("db").value, loadGen);
    if (!s || baselineGen !== loadGen) return;
    if (s.total !== baseSig.total || s.maxId !== baseSig.maxId) {
      const n = s.total - baseSig.total;
      el("refresh").textContent = `🔄 ${n > 0 ? n + " new" : "updated"} — refresh`;
      el("refresh").style.display = "block";
    }
  } catch (e) {}
}
window.doRefresh = async () => { hideRefresh(); await load(); };

/* ---------------- load ---------------- */
function storedDatabase() {
  try { return localStorage.getItem(DATABASE_STORAGE_KEY) || ""; }
  catch (e) { return ""; }
}
function rememberDatabase(name) {
  try { localStorage.setItem(DATABASE_STORAGE_KEY, name); }
  catch (e) {}
}
async function initializeDatabases() {
  const select = el("db");
  const previous = select.value || storedDatabase();
  try {
    const response = await fetch("/api/databases");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const payload = await response.json();
    const configured = Array.isArray(payload) ? payload : payload.databases;
    const databases = [...new Set((Array.isArray(configured) ? configured : [])
      .filter(name => typeof name === "string" && name.length > 0))];
    if (!databases.length) throw new Error("no configured databases");

    const preferred = databases.includes(previous) ? previous
      : (databases.includes(payload.default) ? payload.default : databases[0]);
    const options = databases.map(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      return option;
    });
    select.replaceChildren(...options);
    select.value = preferred;
    select.disabled = false;
    rememberDatabase(preferred);
    await load();
  } catch (e) {
    statsEl.innerHTML = `<span id="err">database config failed: ${esc(e.message)}</span>`;
  }
}

function clearSelectionState() {
  detailOwner.invalidate(); // K1: drop detail ownership
  selectedId = null; hlNodes = new Set();
  document.body.classList.remove("panel-open");
  if (activeRow) { activeRow.classList.remove("active"); activeRow = null; }
  pendingHighlight = null;
  el("panel").innerHTML = "";
}

/**
 * H4: combine lineage + crossrefs degradation into one warning surface.
 * Both flags fail together on the wire today, but disclosure must cover either.
 */
function setIntegrityUiState(lineageOk, crossrefsOk) {
  const w = el("lineage-warn");
  const toggle = el("lineage");
  const parts = [];
  if (!lineageOk) {
    parts.push(
      "Lineage unavailable — cannot confirm which memories are current. "
      + "Current-only mode disabled. Nodes/rows show as authority-unknown (not current).",
    );
  }
  if (!crossrefsOk) {
    parts.push(
      "Crossrefs degraded — duplicate, link, and cluster counts are not certified.",
    );
  }
  if (w) {
    if (parts.length) {
      w.style.display = "block";
      w.textContent = parts.join(" ");
    } else {
      w.style.display = "none";
    }
  }
  if (toggle) {
    // F1: cannot deliver current-only without lineage — disable toggle
    toggle.disabled = !lineageOk;
    if (!lineageOk) {
      toggle.checked = true;
      toggle.title = "Disabled: lineage unavailable, so current-only cannot be guaranteed";
    } else {
      toggle.title = "Default: show lineage — dim superseded nodes and draw supersedes edges. "
        + "Uncheck to hide superseded and authority-unknown (current-state only).";
    }
  }
  // H4: cluster toggle is not meaningful over empty/uncertified cluster data
  const bcl = el("bcl");
  if (bcl) {
    if (!crossrefsOk) {
      bcl.disabled = true;
      bcl.title = "Clusters unavailable — crossrefs degraded";
      bcl.classList.remove("active");
      showClusters = false;
    } else {
      bcl.disabled = false;
      bcl.title = "Toggle cluster hulls";
    }
  }
}

function clearCanvasForSwitch(msg) {
  // F2: do not leave previous graph drawn under the new DB name.
  raw = null;
  if (fg && fg._destructor) { try { fg._destructor(); } catch (e) {} }
  fg = null;
  graphEl.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7d8590">${esc(msg || "loading…")}</div>`;
  statsEl.textContent = msg || "loading…";
}

/** Apply J1 plan against live UI state (call only after raw = new graph). */
function applySelectionReconcile(plan) {
  if (!plan || plan.type === "none") return;
  if (plan.type === "clear") {
    clearSelectionState();
    return;
  }
  // type === "refresh"
  setHighlight(plan.id);
  if (plan.openDetail) {
    openDetail(plan.id, plan.isDupe, null, plan.superseded, { forceFetch: true });
  }
}

// planSelectionReconcile: imported from ./_selection.mjs (shipped; tests import same file).

async function load() {
  if (!el("db").value) return;
  const db = el("db").value;
  const dbChanged = loadDb !== "" && loadDb !== db;
  // Snapshot only for the in-flight "refreshing…" shell — NOT for post-commit restore (J1).
  const startSelected = selectedId;
  const startPanelOpen = document.body.classList.contains("panel-open");
  loadDb = db;
  const gen = ++loadGen;
  if (loadAbort) try { loadAbort.abort(); } catch (e) {}
  loadAbort = typeof AbortController !== "undefined" ? new AbortController() : null;

  // F2: on DB change, clear canvas + selection so A cannot show under B's name.
  if (dbChanged) {
    clearSelectionState();
    clearCanvasForSwitch(`loading ${db}…`);
    mems = null; memsLoaded = false; byId = {}; rowById = {};
    el("tllist").textContent = "loading…";
  } else {
    statsEl.textContent = "loading…";
    // G1: if panel is open at start, mark refreshing so abort cannot strand "loading…".
    // A selection made DURING the request will open its own panel and then J1 re-derives it.
    if (startPanelOpen && startSelected != null) {
      const panel = el("panel");
      if (panel) {
        panel.innerHTML =
          `<button class="close" onclick="closePane()">✕</button>` +
          `<h2>#${startSelected}</h2><div class="meta">refreshing…</div>`;
      }
    }
  }

  try {
    const r = await fetch(
      `/api/graph?db=${encodeURIComponent(db)}${showDocs ? "&docs=1" : ""}`,
      { signal: loadAbort ? loadAbort.signal : undefined },
    );
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (gen !== loadGen || el("db").value !== db) return; // stale response
    raw = data;
    raw.dupeCount = Array.isArray(raw.duplicateIds) ? raw.duplicateIds.length : 0;
    // H4: one combined integrity banner from BOTH flags
    setIntegrityUiState(
      raw.lineageAvailable !== false,
      raw.crossrefsAvailable !== false,
    );
    buildAdj(); buildClusters();
    render();
    // J1: reconcile CURRENT selection after commit (read NOW — not start snapshot).
    // One rule covers kept A, A→B mid-flight, none→B, deselect, panel closed, B deleted,
    // and authority change on the open panel (the measured fail case).
    const plan = planSelectionReconcile(
      selectedId,
      document.body.classList.contains("panel-open"),
      raw.nodes || [],
      raw.duplicateIds,
    );
    applySelectionReconcile(plan);
    if (document.body.classList.contains("timeline-open")) loadMems(gen);
    if (gen === loadGen) { captureBaseline(gen, db); startPolling(); }
  } catch (e) {
    if (e && e.name === "AbortError") return; // newer load owns the panel
    if (gen !== loadGen) return;
    // F2: on failed load after DB switch, do not leave previous graph labelled as new DB
    if (dbChanged) clearCanvasForSwitch(`failed to load ${db}`);
    statsEl.innerHTML = `<span id="err">load failed: ${esc(e.message)} — serve same-origin</span>`;
    // Same-DB failure: if panel is open RIGHT NOW, surface failure (do not invent restore).
    if (!dbChanged && document.body.classList.contains("panel-open") && selectedId != null) {
      const panel = el("panel");
      if (panel) {
        panel.innerHTML =
          `<button class="close" onclick="closePane()">✕</button>` +
          `<h2>#${selectedId}</h2>` +
          `<div class="meta"><span id="err">refresh failed — selection kept, panel stale</span></div>`;
      }
    }
  }
}

el("b2d").onclick = () => { mode = "2d"; el("b2d").classList.add("active"); el("b3d").classList.remove("active"); render(); };
el("b3d").onclick = () => { mode = "3d"; el("b3d").classList.add("active"); el("b2d").classList.remove("active"); render(); };
el("bcl").onclick = () => { showClusters = !showClusters; el("bcl").classList.toggle("active", showClusters); applyHighlight(); };
el("bdoc").onclick = () => { showDocs = !showDocs; el("bdoc").classList.toggle("active", showDocs); load(); };
el("btl").onclick = () => toggleTimeline();
el("tlyear").onchange = () => { el("tlmonth").value = ""; drawTimeline(); };
el("tlmonth").onchange = drawTimeline;
el("tltype").onchange = drawTimeline;
el("tlstatus").onchange = drawTimeline;
el("tlorder").onchange = drawTimeline;
el("tlfav").onclick = () => { el("tlfav").classList.toggle("active"); drawTimeline(); };
el("db").onchange = () => { rememberDatabase(el("db").value); load(); };
let t; el("search").oninput = () => { clearTimeout(t); t = setTimeout(render, 200); };
el("dupes").onchange = render;
// M2: redraw timeline on lineage toggle (not just the canvas).
el("lineage").onchange = () => { buildAdj(); render(); if (mems) drawTimeline(); };
addEventListener("keydown", e => { if (e.key === "Escape") { deselect(); } });
// resume the loop on graph interaction; discrete inputs force-resume (dodge stale
// state), pointermove just keeps it awake. Pauses again after the trailing idle.
["pointerdown", "wheel", "touchstart"].forEach(ev =>
  graphEl.addEventListener(ev, () => forceWake(), { passive: true }));
graphEl.addEventListener("pointermove", () => wake(), { passive: true });
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseRender(); else forceWake(); });
// defaults: timeline drawer open (3D + clusters are set on the mode/state + buttons)
document.body.classList.add("timeline-open"); el("btl").classList.add("active");
initializeDatabases();
</script>
