name = "memora-graph"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages configuration - serve from public directory
pages_build_output_dir = "public"

# D1 Databases - multiple databases supported via ?db= parameter
[[d1_databases]]
binding = "DB_MEMORA"
database_name = "memora-graph"
database_id = "bc1f5b0b-474d-4b96-a2f3-d15279b2ca57"

[[d1_databases]]
binding = "DB_OB1"
database_name = "ob1-graph"
database_id = "d194a6e6-44fa-437d-bfd7-1196c6dc9955"

[[d1_databases]]
binding = "DB_BESTATION"
database_name = "bestation-graph"
database_id = "49dc1f1d-f486-469d-abf8-b3aa0d331e5d"

[[d1_databases]]
binding = "DB_RE"
database_name = "re-graph"
database_id = "c0457fbc-9cdc-4006-afab-878eddac4e44"

# R2 Buckets - multiple buckets for images
[[r2_buckets]]
binding = "R2_MEMORA"
bucket_name = "memora"

[[r2_buckets]]
binding = "R2_OB1"
bucket_name = "ob1"

[[r2_buckets]]
binding = "R2_BESTATION"
bucket_name = "bestation"

[vars]
# Graph settings
MIN_EDGE_SCORE = "0.40"
# WebSocket worker URL for real-time updates
WS_WORKER_URL = "https://memora-graph-sync.cloudflare-strategic612.workers.dev"
# Default database
DEFAULT_DB = "memora"
# Database config (JSON) - maps db name to binding suffix
DB_CONFIG = '{"memora": "MEMORA", "ob1": "OB1", "bestation": "BESTATION", "re": "RE"}'
# Chat LLM model (via OpenRouter). Set OPENROUTER_API_KEY as a secret.
CHAT_MODEL = "x-ai/grok-4.20-beta"
# Model for query rewriting (fast, cheap). Falls back to CHAT_MODEL if unset.
REWRITE_MODEL = "x-ai/grok-4.20-beta"
