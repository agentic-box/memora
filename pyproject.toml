[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memora-mcp"
version = "0.4.0"
description = "MCP-compatible memory server backed by SQLite"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.0.0 removed mcp.server.fastmcp; see memora/server.py.
    # Narrowed to the audited minor: MEMORA_TOOL_PROFILE prunes FastMCP's
    # private _tool_manager._tools dict and attests through the lowlevel
    # registered request handlers at startup. 1.27.0 is the only release
    # the attestation path was verified against; claiming compatibility with
    # 27 untested minor lines would be worse than a tight range. Bump only
    # after re-running tests/test_tool_profile.py against the new release.
    "mcp>=1.27,<1.28",
    "Pillow>=10.4.0",
    "boto3>=1.28.0",
    "filelock>=3.12.0",
    "openai>=1.6.0",
    "starlette>=0.37.0",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "moto[s3]>=5.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
memora-server = "memora.server:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memora*"]

[tool.setuptools.package-data]
"memora.graph" = ["index.html", "_graph_limit.mjs"]
